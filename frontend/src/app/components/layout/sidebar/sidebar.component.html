<div class="brand">
    WEB<span>FINANCER</span>
</div>

<nav class="nav-links">
    <a routerLink="/dashboard" routerLinkActive="active" class="nav-item">
        Command Center
    </a>
    <a routerLink="/ledger" routerLinkActive="active" class="nav-item">
        Universal Ledger
    </a>
    <a routerLink="/vault" routerLinkActive="active" class="nav-item">
        Asset Vault
    </a>
    <a routerLink="/goals" routerLinkActive="active" class="nav-item">
        Goal Tracker
    </a>
    <a routerLink="/reports" routerLinkActive="active" class="nav-item">
        <i class="fas fa-chart-pie"></i>
        <span>Analytics</span>
    </a>
    <a routerLink="/market" routerLinkActive="active" class="nav-item">
        <i class="fas fa-chart-bar"></i>
        <span>Market</span>
    </a>
    <a routerLink="/simulation" routerLinkActive="active" class="nav-item">
        <i class="fas fa-chart-line"></i>
        <span>Simulation</span>
    </a>
    <a routerLink="/documents" routerLinkActive="active" class="nav-item">
        <i class="fas fa-folder-open"></i>
        <span>Documents</span>
    </a>
</nav>

<div class="footer">
    <div class="nav-item theme-toggle" (click)="toggleTheme()">
        <i class="fas" [class.fa-moon]="(isDark$ | async)" [class.fa-sun]="!(isDark$ | async)"></i>
        <span>{{ (isDark$ | async) ? 'Dark Mode' : 'Light Mode' }}</span>
    </div>
    <a routerLink="/login" class="nav-item logout" (click)="logout()">
        <i class="fas fa-sign-out-alt"></i>
        <span>Logout</span>
    </a>
</div>
